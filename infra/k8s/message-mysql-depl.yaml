apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-mysql-depl
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: message-mysql
  template:
    metadata:
      labels:
        app: message-mysql
    spec:
      containers:
        - name: message-mysql
          image: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: myrootpass
            - name: MYSQL_DATABASE
              value: userdb
            - name: MYSQL_USER
              value: user
            - name: MYSQL_PASSWORD
              value: userpass
---
apiVersion: v1
kind: Service
metadata:
  name: message-mysql-srv
spec:
  selector:
    app: message-mysql
  ports:
    - name: db
      protocol: TCP
      port: 3306
      targetPort: 3306