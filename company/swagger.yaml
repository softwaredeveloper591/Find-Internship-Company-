openapi: 3.0.0
info:
  title: Internship Management API
  description: This is an Api for company microservice api
  version: "1.0.0"
servers:
  - url: http://localhost:3005
    description: Local Company Server 
paths:
  /users:
    get:
      summary: Get all users
      description: Retrieve a list of users.
      responses:
        '200':
          description: A JSON array of user objects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: John Doe
  /users/{id}:
    get:
      summary: Get a user by ID
      description: Retrieve a single user by their unique ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to retrieve
          schema:
            type: integer
      responses:
        '200':
          
